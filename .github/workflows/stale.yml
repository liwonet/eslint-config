name: Mark stale issues and pull requests

on:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v11
        with:
          days-before-stale: 14
          days-before-close: 7
          stale-issue-label: Stale
          stale-pr-label: Stale
