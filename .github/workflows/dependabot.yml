name: Auto Merge

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  checks: read
  contents: write
  pull-requests: write

jobs:
  merge:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]' &&
      github.event.workflow_run.pull_requests[0] != null
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
    steps:
      - name: Verify Dependabot pull request
        id: pull-request
        run: |
          AUTHOR="$(gh pr view "$PR_NUMBER" --json author --jq '.author.login')"
          if [[ "$AUTHOR" != 'app/dependabot' ]]; then
            echo "Refusing to merge pull request authored by $AUTHOR"
            exit 1
          fi

          HEAD_SHA="$(gh pr view "$PR_NUMBER" --json headRefOid --jq '.headRefOid')"
          echo "head-sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"

      - name: Wait for all checks
        run: gh pr checks "$PR_NUMBER" --watch --fail-fast

      - name: Squash and merge
        run: >-
          gh pr merge "$PR_NUMBER"
          --squash
          --match-head-commit "${{ steps.pull-request.outputs.head-sha }}"
